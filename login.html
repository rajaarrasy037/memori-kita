<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Memori Raja & Nay</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(116, 104, 180, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(80, 110, 180, 0.12),
                    transparent 35%
                ),
                #0b0b12;
            color: #fff;
            font-family: "Inter", sans-serif;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            position: relative;
            padding: 50px 42px 42px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .login-symbol {
            margin-bottom: 24px;
            text-align: center;
            font-size: 25px;
            color: rgba(210, 200, 240, 0.8);
            text-shadow: 0 0 20px rgba(190, 180, 255, 0.45);
        }

        .login-header {
            margin-bottom: 38px;
            text-align: center;
        }

        .login-header h1 {
            margin-bottom: 10px;
            font-family: "Playfair Display", serif;
            font-size: 46px;
            font-weight: 400;
            line-height: 1;
            letter-spacing: -0.04em;
        }

        .login-header h1 em {
            display: block;
            color: #b8c0ff;
            font-style: normal;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            line-height: 1.7;
            letter-spacing: 1px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .form-group label {
            color: rgba(255, 255, 255, 0.55);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 1.8px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            height: 50px;
            padding: 0 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            outline: none;
            background: rgba(255, 255, 255, 0.045);
            color: white;
            font-family: inherit;
            font-size: 13px;
            transition: 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .form-group input:focus {
            border-color: rgba(184, 192, 255, 0.55);
            background: rgba(255, 255, 255, 0.065);
            box-shadow: 0 0 0 3px rgba(184, 192, 255, 0.07);
        }

        .login-button {
            width: 100%;
            height: 52px;
            margin-top: 8px;
            border: 0;
            border-radius: 13px;
            background: #b8c0ff;
            color: #101018;
            font-family: inherit;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .login-button:hover {
            transform: translateY(-2px);
            background: #c8ceff;
            box-shadow: 0 12px 30px rgba(184, 192, 255, 0.16);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 11px;
            line-height: 1.6;
            text-align: center;
        }

        .message.show {
            display: block;
        }

        .message.error {
            border: 1px solid rgba(255, 100, 100, 0.18);
            background: rgba(255, 80, 80, 0.07);
            color: rgba(255, 180, 180, 0.9);
        }

        .message.success {
            border: 1px solid rgba(120, 220, 170, 0.18);
            background: rgba(80, 200, 140, 0.07);
            color: rgba(170, 240, 200, 0.9);
        }

        .back-link {
            display: block;
            margin-top: 28px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 10px;
            letter-spacing: 1px;
            text-align: center;
            text-decoration: none;
            transition: 0.3s ease;
        }

        .back-link:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        .login-note {
            margin-top: 22px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 9px;
            line-height: 1.7;
            text-align: center;
        }

        @media (max-width: 480px) {
            body {
                padding: 18px;
            }

            .login-card {
                padding: 40px 25px 30px;
                border-radius: 20px;
            }

            .login-header h1 {
                font-size: 40px;
            }
        }
    </style>
</head>

<body>

    <div class="login-wrapper">

        <div class="login-card">

            <div class="login-symbol">^_^</div>

            <div class="login-header">
                <h1>
                    Masuk
                    <em>ke Memori</em>
                </h1>

                <p>
                    masuk untuk mengelola kenangan Raja & Nay
                </p>
            </div>

            <form class="login-form" id="loginForm">

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="masukkan email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="masukkan password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Masuk
                </button>

            </form>

            <div
                class="message"
                id="loginMessage"
            ></div>

            <a
                href="memori.html"
                class="back-link"
            >
                ← kembali ke memori
            </a>

            <div class="login-note">
                Login hanya diperlukan untuk menambah dan mengelola kenangan.
                Pengunjung tetap dapat melihat website tanpa login.
            </div>

        </div>

    </div>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        /* =========================================
           SUPABASE
        ========================================= */

        const SUPABASE_URL =
            "https://lwjnkiexgvmlrbxgwqbt.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_EGaiZXXKufCq6cs6I1z9Fw_5lQqMrcx";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* =========================================
           ELEMENT
        ========================================= */

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const loginMessage =
            document.getElementById("loginMessage");


        /* =========================================
           MESSAGE
        ========================================= */

        function showMessage(message, type) {

            loginMessage.textContent = message;

            loginMessage.className =
                "message show " + type;

        }


        function hideMessage() {

            loginMessage.textContent = "";

            loginMessage.className = "message";

        }


        /* =========================================
           CEK SESSION
        ========================================= */

        async function checkSession() {

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();

    if (!session) {
        return;
    }

    const params =
        new URLSearchParams(
            window.location.search
        );

    const next =
        params.get("next");

    if (next) {

        window.location.href =
            next;

    } else {

        window.location.href =
            "memori.html";

    }

}


        /* =========================================
           LOGIN
        ========================================= */

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                hideMessage();

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value;

                if (!email || !password) {

                    showMessage(
                        "Email dan password wajib diisi.",
                        "error"
                    );

                    return;
                }


                loginButton.disabled = true;

                loginButton.textContent =
                    "Memeriksa...";


                try {

                    const {
                        data,
                        error
                    } = await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });


                    if (error) {

                        console.error(
                            "Login error:",
                            error
                        );

                        showMessage(
                            "Email atau password salah.",
                            "error"
                        );

                        return;
                    }


                    if (!data.session) {

                        showMessage(
                            "Login belum berhasil. Silakan coba lagi.",
                            "error"
                        );

                        return;
                    }


                    showMessage(
                        "Login berhasil. Membuka memori...",
                        "success"
                    );


                    setTimeout(function() {

    const params = new URLSearchParams(
        window.location.search
    );

    const next = params.get("next");

    if (next) {

        window.location.href = next;

    } else {

        window.location.href = "memori.html";

    }

}, 700);


                } catch (error) {

                    console.error(
                        "Unexpected login error:",
                        error
                    );

                    showMessage(
                        "Terjadi kesalahan. Silakan coba lagi.",
                        "error"
                    );

                } finally {

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Masuk";

                }

            }
        );


        /* =========================================
           JALANKAN
        ========================================= */

        checkSession();

    </script>

</body>
</html>
